version: 2
updates:
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    # `flutter_localizations` del SDK fija intl a una version EXACTA
    # (hoy 0.20.2), asi que cualquier bump falla en `flutter pub get`
    # con "version solving failed". Solo se desbloquea al subir la
    # version de Flutter; hasta entonces la PR seria inviable. Ver #7.
    ignore:
      - dependency-name: intl

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [ci, dependencies]
