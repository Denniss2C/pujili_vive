name: "✨ Solicitud de feature"
description: Propón una funcionalidad nueva
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: ¿Qué problema resuelve?
      description: Describe la necesidad o el caso de uso.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Solución propuesta
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
