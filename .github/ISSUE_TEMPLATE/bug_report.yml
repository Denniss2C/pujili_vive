name: "🐛 Reporte de bug"
description: Reporta un error para ayudarnos a mejorar
labels: [bug]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del bug
      description: ¿Qué pasó? ¿Qué esperabas que pasara?
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a '...'
        2. Tocar en '...'
        3. Ver el error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión / rama
      placeholder: "1.0.0 / main"
  - type: dropdown
    id: plataforma
    attributes:
      label: Plataforma
      multiple: true
      options: [Android, iOS, Web]
  - type: textarea
    id: extra
    attributes:
      label: Capturas / logs
