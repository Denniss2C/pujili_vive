name: CI

# Corre en cada PR y en cada push a main. Es la red que evita que la
# calidad se degrade entre entregas.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Varios push seguidos a un PR cancelan los builds anteriores: solo
# interesa el último, y así no se gastan minutos de más.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  calidad:
    name: Formato, análisis y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formato
        run: dart format --set-exit-if-changed lib test

      # OJO: `flutter analyze` trae --fatal-infos y --fatal-warnings
      # ACTIVADOS por defecto. Los lints de nivel "info" de
      # analysis_options todavía NO deben romper el build, así que se
      # desactivan explícitamente; siguen siendo visibles en el log.
      # Se endurecerá quitando --no-fatal-infos cuando el código los
      # cumpla del todo (ver project_rules/09_code_style.md).
      - name: Análisis estático
        run: flutter analyze --no-fatal-infos

      - name: Tests con cobertura
        run: flutter test --coverage

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/lcov.info
          retention-days: 7

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: calidad
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: APK de debug (prod)
        run: flutter build apk --flavor prod -t lib/core/flavors/main_prod.dart --debug

      - uses: actions/upload-artifact@v7
        with:
          name: pujili-vive-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
