name: pujili_vive
description: "App móvil de turismo para promocionar Pujilí, Cotopaxi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  dartz: ^0.10.1
  equatable: ^2.0.5

  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter

  get_it: ^9.2.1

  google_maps_flutter: ^2.9.0
  intl: any

  # El idioma elegido en Ajustes sobrevive al cierre de la app.
  shared_preferences: ^2.3.3

  # "Cómo llegar" abre la app de mapas del teléfono con las coordenadas.
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_test: ^9.1.7

  # Generan iconos y splash nativos a partir de la marca. Son de
  # desarrollo: se ejecutan a mano y escupen recursos al proyecto; no
  # entran en el binario.
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
    - assets/data/
    - assets/images/

# Marca: `dart run flutter_launcher_icons` regenera los iconos.
flutter_launcher_icons:
  image_path: assets/brand/icon.png
  android: true
  ios: true
  # iOS rechaza iconos con canal alfa al subir a la App Store.
  remove_alpha_ios: true
  # Android recorta el icono adaptativo, asi que el primer plano lleva
  # margen y el fondo es el verde de la paleta.
  adaptive_icon_background: "#1F4A3A"
  adaptive_icon_foreground: assets/brand/icon_foreground.png

# Splash: `dart run flutter_native_splash:create` regenera los recursos.
flutter_native_splash:
  color: "#1F4A3A"
  image: assets/brand/logo.png
  android_12:
    color: "#1F4A3A"
    image: assets/brand/icon_foreground.png
