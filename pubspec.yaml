name: pujili_vive
description: "App móvil de turismo para promocionar Pujilí, Cotopaxi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  dartz: ^0.10.1
  equatable: ^2.0.5

  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter

  get_it: ^9.2.1

  google_maps_flutter: ^2.9.0
  intl: any

  # "Cómo llegar" abre la app de mapas del teléfono con las coordenadas.
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_test: ^9.1.7
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
    - assets/images/
